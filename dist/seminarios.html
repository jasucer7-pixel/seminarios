<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seminarios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna de lectura (max 760px), barra superior fija y pestañas desplazables. */
:root {
  --bg: #f4f5f3;
  --surface: #ffffff;
  --ink: #16191d;
  --muted: #5b626a;
  --line: #dcdfdc;
  --accent: #2f47b8;
  --accent-ink: #ffffff;
  --accent-soft: rgba(47, 71, 184, 0.09);
  --mark: rgba(242, 207, 59, 0.55);
  --ok: #1d7a4e;
  --ok-soft: rgba(29, 122, 78, 0.1);
  --bad: #b2342c;
  --bad-soft: rgba(178, 52, 44, 0.09);
  --b1: #2f47b8;
  --b2: #1d7a4e;
  --b3: #a05a12;
  --b4: #8a2f74;
  --b5: #2d6f86;
  --gold: #c98a00;
  --gold-soft: rgba(201, 138, 0, 0.12);

  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r: 10px;
  --maxw: 760px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --surface: #181b1f; --ink: #e7e9ec; --muted: #9aa1a9; --line: #2a2e34;
    --accent: #8fa2ff; --accent-ink: #0f1430; --accent-soft: rgba(143, 162, 255, 0.12);
    --mark: rgba(214, 180, 40, 0.38); --ok: #5cc596; --ok-soft: rgba(92, 197, 150, 0.12);
    --bad: #f07c72; --bad-soft: rgba(240, 124, 114, 0.12);
    --b1: #8fa2ff; --b2: #5cc596; --b3: #e3a35b; --b4: #db8cc9; --b5: #6cc3de; --gold: #f2c14e; --gold-soft: rgba(242, 193, 78, 0.12);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --surface: #181b1f; --ink: #e7e9ec; --muted: #9aa1a9; --line: #2a2e34;
  --accent: #8fa2ff; --accent-ink: #0f1430; --accent-soft: rgba(143, 162, 255, 0.12);
  --mark: rgba(214, 180, 40, 0.38); --ok: #5cc596; --ok-soft: rgba(92, 197, 150, 0.12);
  --bad: #f07c72; --bad-soft: rgba(240, 124, 114, 0.12);
  --b1: #8fa2ff; --b2: #5cc596; --b3: #e3a35b; --b4: #db8cc9; --b5: #6cc3de; --gold: #f2c14e; --gold-soft: rgba(242, 193, 78, 0.12);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--f-body);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
strong { font-weight: 600; background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 1px; }
em { font-style: italic; }

.wrap {
  max-width: var(--maxw);
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Barra superior */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 12px; height: 52px; }
.brand { font-family: var(--f-display); font-size: 22px; color: var(--ink); letter-spacing: 0.01em; }
.brand:hover { text-decoration: none; }
.crumb { color: var(--muted); font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.top .spacer { flex: 1; }
.top .link { font-size: 13px; color: var(--muted); white-space: nowrap; }

main { padding-block: 28px 80px; }

/* Tipografía */
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 6vw, 44px); line-height: 1.08; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.2; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-l { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Botones */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface);
  padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; line-height: 1.2;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* Inicio */
.hero { display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px; }
.hero p { color: var(--muted); max-width: 58ch; }
.sem { display: flex; flex-direction: column; gap: 12px; margin-bottom: 36px; }
.sem-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.item {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center;
  padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  color: var(--ink);
}
.item:hover { text-decoration: none; border-color: var(--muted); }
.item .who { font-size: 13px; color: var(--muted); }
.item .what { font-weight: 600; }
.item .go { grid-row: 1 / span 3; grid-column: 2; color: var(--muted); font-size: 20px; }
.item > div { min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.off { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.empty { padding: 16px 18px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); font-size: 14px; }

/* Cabecera de texto */
.thead { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.thead .es { color: var(--muted); }
.thead .src { font-size: 12px; color: var(--muted); }

.tabs {
  display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--line); margin-bottom: 24px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 10px 10px; cursor: pointer; white-space: nowrap; color: var(--muted); font-size: 14px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

/* Bloques */
.thesis {
  font-family: var(--f-display); font-size: 23px; line-height: 1.38;
  padding: 4px 0 4px 18px; border-left: 2px solid var(--ink);
}
.thesis strong { font-weight: 400; }
.prose { max-width: 66ch; }
.prose p + p { margin-top: 10px; }

details.sec { border-top: 1px solid var(--line); }
details.sec:last-child { border-bottom: 1px solid var(--line); }
details.sec summary {
  cursor: pointer; list-style: none; padding: 12px 0; font-weight: 600;
  display: flex; justify-content: space-between; gap: 12px;
}
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::after { content: "+"; color: var(--muted); font-weight: 400; }
details.sec[open] summary::after { content: "–"; }
details.sec ul { margin: 0 0 14px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 66ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.card.soft { background: transparent; }

/* Cronología */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.timeline li:last-child { border-bottom: 1px solid var(--line); }
.timeline li > span { min-width: 0; }
.timeline .yr { font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

/* Esquema del argumento */
.arg { display: flex; flex-direction: column; gap: 6px; }
.arg-row { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: baseline; padding: 8px 0; }
.arg-row > div { min-width: 0; }
.arg-id { font-family: var(--f-mono); font-size: 12px; font-weight: 600; text-align: center; padding: 2px 0; border-radius: 6px; }
.arg-row.premisa .arg-id { background: var(--accent-soft); color: var(--accent); }
.arg-row.conclusion .arg-id { background: var(--ink); color: var(--bg); }
.arg-row.conclusion > div { font-weight: 600; }
.arg-row.objecion { margin-left: 22px; }
.arg-row.objecion .arg-id { background: var(--bad-soft); color: var(--bad); }
.arg-row.respuesta { margin-left: 44px; }
.arg-row.respuesta .arg-id { background: var(--ok-soft); color: var(--ok); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.legend .lp::before { background: var(--accent); }
.legend .lc::before { background: var(--ink); }
.legend .lo::before { background: var(--bad); }
.legend .lr::before { background: var(--ok); }

/* Mapa mental */
.mapbox { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px; }
.mapbox svg { display: block; }
.mapbox .node { cursor: pointer; }
.mapbox text { font-family: var(--f-body); font-size: 12.5px; fill: var(--ink); }
.mapbox .root text { font-size: 14px; font-weight: 600; fill: var(--accent-ink); }
.outline { margin: 0; padding-left: 18px; }
.outline ul { padding-left: 18px; }
.outline li { margin: 3px 0; }
.outline > li { font-weight: 600; margin-top: 10px; }
.outline > li li { font-weight: 400; }

/* Conceptos */
.concept { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.concept:last-child { border-bottom: 1px solid var(--line); }
.concept .term { font-weight: 600; }
.concept .en { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.concept .ex { font-size: 13px; color: var(--muted); }
.concept.hidden-def .def, .concept.hidden-def .ex { filter: blur(6px); cursor: pointer; user-select: none; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }

/* Casos */
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.case { display: flex; flex-direction: column; gap: 8px; }
.case > * { min-width: 0; }
.case .by { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.case h3 { font-family: var(--f-display); font-weight: 400; font-size: 21px; font-style: italic; }
.reveal { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }

/* Tarjetas */
.fc { min-height: 220px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 22px; }
.fc .q { font-family: var(--f-display); font-size: 24px; line-height: 1.3; }
.fc .a { border-top: 1px solid var(--line); padding-top: 14px; }
.meter { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
.boxes { display: flex; gap: 6px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.boxes b { font-weight: 600; color: var(--ink); }

/* Test */
.quiz .qtext { font-size: 18px; font-weight: 600; line-height: 1.4; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  appearance: none; text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px 14px; cursor: pointer; font-size: 15px; line-height: 1.45;
}
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { border-radius: var(--r); padding: 12px 14px; font-size: 14px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.ko { background: var(--bad-soft); }
.score { font-family: var(--f-display); font-size: 64px; line-height: 1; }
.src-tag { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* Ejercicios */
.ex-k { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
textarea {
  width: 100%; min-height: 110px; resize: vertical; padding: 12px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--bg); line-height: 1.5;
}
input[type="text"] { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.checks { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.checks label { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }

/* Citas */
blockquote { margin: 0; padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
blockquote:last-child { border-bottom: 1px solid var(--line); }
blockquote .c { font-family: var(--f-display); font-size: 20px; line-height: 1.35; }
blockquote .meta { font-size: 13px; color: var(--muted); }

/* Ruta 20 */
.route-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.clock { font-family: var(--f-mono); font-size: 34px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.clock.over { color: var(--bad); }
.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.step {
  appearance: none; border: 0; background: none; cursor: pointer; padding: 0; text-align: left;
  display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: var(--muted); min-width: 0;
}
.step i { display: block; height: 4px; border-radius: 4px; background: var(--line); }
.step.done i { background: var(--ink); }
.step.cur i { background: var(--accent); }
.step.cur { color: var(--ink); font-weight: 600; }
.step span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step-title .eyebrow { color: var(--accent); }
.nav { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }

/* Tablas */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 600px; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 600; white-space: nowrap; }

/* Método */
.method { display: flex; flex-direction: column; gap: 0; }
.method .m { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.method .m:last-child { border-bottom: 1px solid var(--line); }
.method .m > div { min-width: 0; }
.method .t { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.evid { display: flex; flex-direction: column; gap: 10px; }
.evid li { max-width: 66ch; }
.lvl { font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.lvl.alta { background: var(--ok-soft); color: var(--ok); }
.lvl.media { background: var(--accent-soft); color: var(--accent); }
.lvl.baja { background: var(--bad-soft); color: var(--bad); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 20;
}

/* Juego */
.game { position: relative; display: flex; flex-direction: column; gap: 16px; }
.g-hero { display: flex; flex-direction: column; gap: 16px; padding: 24px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.g-hero h2 { font-size: 34px; }
.g-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.g-stats > div { display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 10px; background: var(--bg); min-width: 0; }
.g-stats b { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; text-transform: capitalize; }
.g-stats span { font-size: 11px; color: var(--muted); }
.g-rules { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.g-rules li { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.g-play { font-size: 16px; padding: 12px 28px; font-weight: 600; }
.g-hud {
  position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 4;
  display: grid; grid-template-columns: auto auto 1fr auto; gap: 12px; align-items: center;
  padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.g-lives { display: flex; gap: 4px; }
.g-lives i { width: 14px; height: 14px; border-radius: 50%; background: var(--bad); transition: transform .25s, opacity .25s; }
.g-lives i.off { background: var(--line); transform: scale(.7); }
.g-prog { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.g-combo { font-family: var(--f-mono); font-weight: 600; font-size: 15px; justify-self: center; white-space: nowrap; }
.g-combo small { font-weight: 400; color: var(--muted); font-size: 11px; }
.g-combo.m2 { color: var(--b2); } .g-combo.m3 { color: var(--b3); } .g-combo.m4 { color: var(--b4); }
.g-score { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
.g-card { position: relative; overflow: visible; }
.g-card.gold { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.g-gold { color: var(--gold); }
.g-card.g-ok { animation: okflash .6s ease-out; }
@keyframes okflash { 0% { box-shadow: 0 0 0 0 var(--ok); } 100% { box-shadow: 0 0 0 14px transparent; } }
.g-card.g-ko, .shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.g-timer { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.g-timer i { display: block; height: 100%; width: 100%; background: var(--accent); }
.g-timer.low i { background: var(--bad); }
.opts.vf { flex-direction: row; } .opts.vf .opt { flex: 1; text-align: center; font-weight: 600; }
.small-opt { font-size: 14px; padding: 10px 12px; }
.g-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.g-chip { appearance: none; border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.g-chip.sel { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.g-chip.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); cursor: default; }
.g-num { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 8px; border-radius: 50%; background: var(--ink); color: var(--bg); font-family: var(--f-mono); font-size: 12px; }
.g-float { position: absolute; right: 18px; top: -8px; font-family: var(--f-mono); font-weight: 600; font-size: 24px; color: var(--ok); pointer-events: none; animation: floatup .9s ease-out forwards; }

  conceptos: [
    { t: "Principio de inmunidad de los no combatientes (PNI)", en: "Principle of non-combatant immunity", d: "Es impermisible atacar intencionadamente a no combatientes en la guerra, aunque pertenezcan al bando injusto. Se considera universal.", e: "Prohíbe bombardear a propósito un barrio residencial del país agresor." },
    { t: "Liability (ser «liable» a un daño)", en: "Liability to defensive harm", d: "Una persona es *liable* a un daño si infligírselo no la agravia (no viola sus derechos). Además, no puede defenderse legítimamente contra ese daño.", e: "Un agresor culpable es *liable* a que su víctima lo mate en defensa propia." },
    { t: "Amenaza directa", en: "Direct threat", d: "Quien va a infligirte él mismo el daño.", e: "Te dispara, te envenena, cae sobre ti." },
    { t: "Amenaza indirecta", en: "Indirect threat", d: "Quien no te inflige el daño, pero te pone en peligro de otro modo.", e: "Bloquea tu vía de escape; fabrica el arma con la que te dispararán." },
    { t: "Amenaza injusta", en: "Unjust threat", d: "Amenaza dirigida a alguien que no es *liable* a sufrir ese daño.", e: "Los soldados de una guerra de agresión amenazan injustamente a los defensores." },
    { t: "Liability ≠ permisibilidad", en: "Liability vs. permissibility", d: "Que alguien sea *liable* no implica que sea permisible dañarle. Puede haber otras razones (falta de necesidad) que lo hagan impermisible. Es la idea central del texto.", e: "*Lucky Escape*: el Asesino es *liable*, pero quizá la víctima debería saltar en paracaídas." },
    { t: "Inocencia material", en: "Material innocence", d: "Base tradicional del PNI: los no combatientes no amenazan, no están «haciendo daño» (lat. *nocentes* = los que dañan).", e: "Frowe la considera *prima facie* implausible." },
    { t: "Participación directa en las hostilidades", en: "Direct part in hostilities", d: "Criterio jurídico (Manual británico, 2004): solo quienes participan directamente pueden ser atacados; trabajar en una fábrica de municiones no cuenta.", e: "Frowe: distinción «totalmente artificial»." },
    { t: "Principio de agencia interviniente", en: "Principle of intervening agency (Rodin)", d: "Si varios agentes crean una amenaza injusta y todos superan un umbral de responsabilidad mínima, solo el último de la cadena causal está «actualmente implicado» y es *liable*.", e: "En *Provocation*, solo el Atacante, no el Villano que lo provocó." },
    { t: "Umbral causal", en: "Causal threshold", d: "Idea (McMahan, Fabre) de que la contribución individual debe ser suficientemente grande para generar *liability*.", e: "Fabre: hacer piezas de armas no basta. Frowe lo refuta con *Hit*." },
    { t: "Proporcionalidad", en: "Proportionality", d: "El daño defensivo no debe ser excesivo respecto al daño que se evita. Para Frowe depende de la gravedad del daño amenazado y de la fuerza usada, no de cuánto contribuye cada uno.", e: "Matar a un mafioso para salvar tu vida es proporcionado aunque solo pusiera unas libras." },
    { t: "Ignorancia inevitable", en: "Unavoidable ignorance (Fabre)", d: "No poder saber que uno plantea una amenaza o que esta es injusta. Para Fabre anula la responsabilidad moral y, con ella, la *liability*.", e: "La costurera de uniformes no sabe si se usarán en una fase justa o injusta de la guerra." },
    { t: "Distinción hacer / permitir", en: "Doing/allowing distinction", d: "Causar un daño es peor que permitirlo. Genera una presunción: ante la duda, no contribuir a un daño injusto, aunque así no se rescate a otros.", e: "Base de la réplica de Frowe a Fabre." },
    { t: "Necesidad militar", en: "Military necessity (jus in bello)", d: "El daño en la guerra debe producir una ventaja militar. Para McMahan es interna a la *liability*; para Frowe es una condición aparte de permisibilidad.", e: "Matar a quien votó por la guerra no aporta ventaja militar." },
    { t: "Jus ad bellum / jus in bello", en: "", d: "*Ad bellum*: justicia del recurso a la guerra. *In bello*: justicia en la conducción de la guerra (discriminación, necesidad, proporcionalidad).", e: "Frowe solo habla de civiles del bando *ad bellum* injusto." }
  ],

  casos: [
    { n: "Naughty Minister", de: "Rodin", d: "Por recortes fraudulentos del Ministro, sale de prisión un Criminal que intenta matar a Víctima. Víctima puede salvarse matando al Criminal o arrollando mortalmente al Ministro.", prueba: "Rodin: solo puede matar al Criminal (causa próxima). Ilustra la agencia interviniente." },

    { n: "Coercion", de: "Cheyney Ryan (usado por Rodin)", d: "Tras ocupar un pueblo, un nazi obliga al Alcalde a disparar a un Ciudadano bajo amenaza de matar a muchos más.", prueba: "La responsabilidad es compartible: el Alcalde no libera al nazi. Frowe: también la *liability*: el Ciudadano podría matar al nazi." },
    { n: "Goading", de: "Rodin", d: "El Villano provoca deliberadamente a Víctima para que le ataque y así poder matarla «en defensa propia».", prueba: "El Villano no puede alegar legítima defensa porque creó la situación amenazante. Frowe: importa si esa situación sigue vigente, no la proximidad causal." },

    { n: "Hit", de: "Frowe", d: "El Jefe mafioso hace una colecta entre todos sus hombres para pagar a un asesino carísimo. Cada uno pone unas pocas libras.", prueba: "Cada mafioso es *liable* aunque su aportación sea mínima. Importa **si** contribuyes, no **cuánto**. Refuta el umbral causal." },
    { n: "Cadena de montaje vs. tándem", de: "Frowe", d: "Una fábrica produce 200 armas al día: o cada obrero hace una pieza de todas, o cada uno fabrica un arma entera.", prueba: "Un umbral causal haría *liable* solo a los del tándem. Diferencia implausible: todos aportan armas al bando injusto." },
    { n: "Lucky Escape", de: "Frowe", d: "Un Asesino persigue a Víctima para matarla. Víctima tiene un paracaídas y puede escapar sin matarlo.", prueba: "El Asesino sigue siendo *liable* aunque matarle no sea necesario. La necesidad afecta a la permisibilidad, no a la *liability*." }
  ],

<script>
/* Seminarios — app de estudio. Sin dependencias. */
(function () {

  var SEMS = window.SEMINARIOS || [];
  var TXT = window.TEXTOS || {};
  var app = document.getElementById("app");

  var timers = [];

  /* ---------- utilidades ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function md(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>");
  }
  function h(tag, props) {
    var el = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el) {
    for (var i = 1; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null || kid === false) continue;
      if (Array.isArray(kid)) kid.forEach(function (k) { add(el, k); });
      else el.appendChild(typeof kid === "object" ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function today(offset) {
    var d = new Date();
    d.setHours(12, 0, 0, 0);
    if (offset) d.setDate(d.getDate() + offset);
    return d.toISOString().slice(0, 10);
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var diff = Math.round((new Date(iso + "T12:00:00") - new Date(today() + "T12:00:00")) / 864e5);
    if (diff === 0) return "hoy";
    if (diff === 1) return "mañana";
    if (diff === -1) return "ayer";
    if (diff > 1) return "en " + diff + " días";
    return "hace " + -diff + " días";
  }
  function toast(msg) {
    var t = h("div", { class: "toast", role: "status" }, msg);
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }

  /* ---------- almacenamiento local ---------- */
  var KEY = "seminarios:v1";
  var mem = {};
  function loadStore() {
    try { mem = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { mem = {}; }
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* sin almacenamiento */ }
  }
  function st(id) {
    mem[id] = mem[id] || { cards: {}, notes: {} };
    mem[id].cards = mem[id].cards || {};
    mem[id].notes = mem[id].notes || {};
    return mem[id];
  }
  loadStore();

  /* ---------- tarjetas: repetición espaciada (Leitner) ---------- */
  var INTERVAL = [0, 1, 3, 7, 14, 30];
  function cardState(id, i) { return st(id).cards[i] || { box: 0, due: today() }; }
  function dueCount(id) {
    var t = TXT[id];
    if (!t) return 0;
    var n = 0, now = today();
    t.tarjetas.forEach(function (_, i) { if (cardState(id, i).due <= now) n++; });
    return n;
  }

  /* ---------- enrutado por hash ---------- */
  var TABS = [

    ["conceptos", "Conceptos"], ["casos", "Casos"], ["debate", "Debate"],

  ];
  function go(hash) {
    if (location.hash.slice(1) === hash) render(); else location.hash = hash;
  }

    if (hsh.indexOf("s-") === 0) return viewSeminar(hsh.slice(2));

      var parts = hsh.slice(2).split("-");
      if (TXT[parts[0]]) return viewText(parts[0], parts[1] || defaultTab(parts[0]));
    }
    viewHome();
  }
  function defaultTab(id) { return st(id).ruta ? "resumen" : "ruta"; }
  function setCrumb(parts) {
    clear(crumb);
    parts.forEach(function (p, i) {
      if (i) add(crumb, " / ");
      add(crumb, p[1] ? h("a", { href: "#" + p[1], style: "color:inherit" }, p[0]) : p[0]);
    });
  }

  /* ---------- vista: inicio ---------- */
  function progressChips(id) {
    var s = st(id), t = TXT[id], chips = [];

    if (s.test) chips.push(h("span", { class: "chip" + (s.test.best >= 80 ? " ok" : "") }, "Test " + s.test.best + "%"));
    var due = dueCount(id);
    if (s.ruta || Object.keys(s.cards).length) {
      chips.push(due ? h("span", { class: "chip" }, due + " tarjetas hoy") : h("span", { class: "chip ok" }, "Tarjetas al día"));
    } else {
      chips.push(h("span", { class: "chip off" }, t.tarjetas.length + " tarjetas"));

    if (s.game && s.game.best) chips.push(h("span", { class: "chip medal " + (s.game.medal || "none") }, (s.game.medal ? s.game.medal[0].toUpperCase() + s.game.medal.slice(1) + " · " : "Juego · ") + s.game.best + " pts"));
    return h("div", { class: "chips" }, chips);
  }
  function textItem(id) {
    var t = TXT[id];

  /* --- Ruta 20 minutos --- */

  function tabRuta(t, el) {
    var s = st(t.id);
    var r = s.rutaState || { step: 0, left: 20 * 60 };

    var playBtn = h("button", { class: "btn primary" });
    var stepsBar = h("div", { class: "steps" });

    function fmt(sec) {

      clear(stepsBar);

    function finish() {

      t.tarjetas.forEach(function (_, i) { if (!s.cards[i]) s.cards[i] = { box: 0, due: today(1) }; });

      s.rutaState = r;

      clear(content);
      paintClock();
      add(content, h("div", { class: "card stack" },
        h("span", { class: "eyebrow" }, "Ruta completada"),

        h("ul", { class: "evid" },
          h("li", null, h("strong", null, "Mañana (5 min):"), " tarjetas."),

    function paintStep() {

      add(content, h("div", { class: "stack" },
        h("div", { class: "step-title" }, h("span", { class: "eyebrow" }, "Paso " + (r.step + 1) + " · " + sp.min + " min"), h("h2", null, sp.n)),
        h("p", { class: "muted" }, sp.why)));

      if (sp.k === "estructura") { add(body, mapBlock(t)); add(body, h("h3", null, "Esquema del argumento")); add(body, argBlock(t)); }
      if (sp.k === "claves") { add(body, conceptsBlock(t, true)); add(body, h("h3", null, "Casos")); add(body, casesBlock(t)); }
      if (sp.k === "recupera") {
        add(body, quiz(shuffle(t.test).slice(0, 8).map(function (q) { return normalizeQ(q, t.autor); }), function (pct) { saveTest(t.id, pct); }));

        h("div", { class: "row" }, playBtn,
          h("button", { class: "btn ghost", onclick: function () { r = { step: 0, left: 20 * 60 }; running = false; persist(); paintClock(); paintStep(); } }, "Reiniciar"))),

  /* ---------- JUEGO ---------- */
  // Partida de 12 retos generados del contenido de uno o varios textos.
  // Recompensas: puntos por rapidez, rachas que multiplican, preguntas doradas (x2),
  // vidas, récords, medallas, XP con niveles y racha de días.
  var G_TOTAL = 12, G_LIVES = 3;
  function gProfile() {
    mem._game = mem._game || { xp: 0, days: 0, last: "", sound: true };
    return mem._game;
  }
  function gLevel(xp) {
    var lvl = 1, need = 300;
    while (xp >= need) { xp -= need; lvl++; need = 300 + (lvl - 1) * 150; }
    return { lvl: lvl, into: xp, need: need };
  }
  function gMedal(acc) { return acc >= 90 ? "oro" : acc >= 75 ? "plata" : acc >= 50 ? "bronce" : ""; }
  function gRank(acc) { return acc >= 90 ? "Maestría" : acc >= 75 ? "Muy bien" : acc >= 50 ? "Vas bien" : "Calentando"; }
  function short(s, n) { s = String(s).replace(/\*\*/g, ""); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, "") + "…" : s; }
  function pick(a, n, not) {
    return shuffle(a.filter(function (x) { return x !== not; })).slice(0, n);
  }

  /* Sonido: tonos cortos con WebAudio, solo tras interacción */
  var actx = null;
  function beep(freqs, dur, type) {
    if (!gProfile().sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = actx.currentTime;
      freqs.forEach(function (f, i) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = type || "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + i * dur);
        g.gain.exponentialRampToValueAtTime(0.18, t0 + i * dur + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.02);
      });
    } catch (e) { /* sin audio */ }
  }
  function sfxRight(combo) { var b = 520 * Math.pow(1.06, Math.min(combo, 12)); beep([b, b * 1.25], 0.07, "triangle"); }
  function sfxWrong() { beep([220, 160], 0.12, "sawtooth"); }
  function sfxBig() { beep([523, 659, 784, 1047], 0.09, "triangle"); }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* nada */ } }
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Confeti en canvas */
  function confetti(amount) {
    if (reduced) return;
    var cv = h("canvas", { class: "confetti", "aria-hidden": "true" });
    document.body.appendChild(cv);
    var W = cv.width = window.innerWidth, H = cv.height = window.innerHeight, ctx = cv.getContext("2d");
    var cs = getComputedStyle(document.documentElement);
    var cols = ["--b1", "--b2", "--b3", "--b4", "--b5", "--gold"].map(function (v) { return cs.getPropertyValue(v).trim() || "#888"; });
    var ps = [];
    for (var i = 0; i < (amount || 120); i++) {
      ps.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.35, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 14 - 4,
        r: Math.random() * 6 + 4, c: cols[i % cols.length], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4 });
    }
    var start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(function (p) {
        p.vy += 0.4; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
        ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
      });
      if (now - start < 1800) requestAnimationFrame(frame); else cv.remove();
    })(start);
  }

  /* Generador de retos a partir de los datos del texto */
  function makeChallenges(texts) {
    var multi = texts.length > 1, pool = [];
    texts.forEach(function (t) {
      var tag = t.autor;
      t.test.forEach(function (q) {
        if (typeof q.v === "boolean") pool.push({ kind: "vf", src: tag, q: q.q, o: ["Verdadero", "Falso"], r: q.v ? 0 : 1, x: q.x, fixed: true, time: 9 });
        else pool.push({ kind: "mc", src: tag, q: q.q, o: q.o, r: q.r, x: q.x, time: 16 });
      });
      t.tarjetas.forEach(function (c) {
        var others = pick(t.tarjetas, 2, c).map(function (o) { return o.a; });
        pool.push({ kind: "mc", label: "Tarjeta", src: tag, q: c.q, o: [c.a].concat(others), r: 0, x: "", time: 18 });
      });
      t.conceptos.forEach(function (c) {
        var others = pick(t.conceptos, 3, c);
        pool.push({ kind: "mc", label: "¿Qué término es?", src: tag, q: short(c.d, 170), o: [c.t].concat(others.map(function (o) { return o.t; })), r: 0, x: "**" + c.t + "**: " + c.d, time: 14 });
        var fake = Math.random() < 0.5, other = others[0];
        pool.push({ kind: "vf", label: "Relámpago", src: tag, q: "**" + c.t + "**: " + short(fake ? other.d : c.d, 150), o: ["Verdadero", "Falso"], r: fake ? 1 : 0, fixed: true,
          x: fake ? "Esa es la definición de **" + other.t + "**." : "Correcto: es su definición.", time: 8 });
      });
      if (t.conceptos.length >= 4) {
        for (var k = 0; k < 3; k++) pool.push({ kind: "match", src: tag, pairs: pick(t.conceptos, 4), time: 40 });
      }
      t.casos.forEach(function (c) {
        if (t.casos.length < 3) return;
        var others = pick(t.casos, 2, c);
        pool.push({ kind: "mc", label: "Caso", src: tag, q: "¿Qué prueba **" + c.n + "**?", o: [c.prueba].concat(others.map(function (o) { return o.prueba; })), r: 0, x: c.d, time: 20 });
      });
      var obs = t.argumento.filter(function (a) { return a.k === "objecion"; });
      var res = t.argumento.filter(function (a) { return a.k === "respuesta"; });
      if (obs.length >= 2 && res.length >= 2) {
        obs.forEach(function (o) {
          var i = t.argumento.indexOf(o), ans = t.argumento[i + 1];
          if (!ans || ans.k !== "respuesta") return;
          pool.push({ kind: "mc", label: "Réplica", src: tag, q: "Objeción: " + o.t + " ¿Qué responde el texto?", o: [ans.t].concat(pick(res, 2, ans).map(function (x) { return x.t; })), r: 0, x: "", time: 20 });
        });
      }
      if (t.cronologia && t.cronologia.length >= 4) {
        for (var j = 0; j < 3; j++) pool.push({ kind: "order", src: tag, items: pick(t.cronologia, 4), time: 30 });
      }
      if (multi) {
        t.citas.forEach(function (c) {
          pool.push({ kind: "mc", label: "¿Quién lo dijo?", src: "", q: "«" + c.c + "»", o: texts.map(function (x) { return x.autor; }), r: texts.indexOf(t), x: c.n, fixed: true, time: 12 });
        });
      }
    });
    // Mezcla equilibrada por tipo, para que la partida sea variada
    var byKind = {};
    shuffle(pool).forEach(function (c) { (byKind[c.kind + (c.label || "")] = byKind[c.kind + (c.label || "")] || []).push(c); });
    var keys = Object.keys(byKind), out = [], ki = 0;
    while (out.length < G_TOTAL + 6 && keys.some(function (k) { return byKind[k].length; })) {
      var k2 = keys[ki++ % keys.length];
      if (byKind[k2].length) out.push(byKind[k2].pop());
    }
    out = shuffle(out);
    out.forEach(function (c) { c.gold = Math.random() < 0.13; });
    return out;
  }

  function gameView(texts, key, title) {
    var root = h("div", { class: "game" });
    var prof = gProfile();
    var ivTimer = null;

    function stopTimer() { if (ivTimer) { clearInterval(ivTimer); ivTimer = null; } }

    function intro() {
      stopTimer();
      clear(root);
      var gs = st(key).game || {};
      var L = gLevel(prof.xp);
      add(root,
        h("div", { class: "g-hero" },
          h("span", { class: "eyebrow" }, title),
          h("h2", null, "¿Cuánto aguantas?"),
          h("div", { class: "g-stats" },
            h("div", null, h("b", null, gs.best || 0), h("span", null, "récord")),
            h("div", null, h("b", null, gs.medal ? gs.medal : "—"), h("span", null, "medalla")),
            h("div", null, h("b", null, "Nv " + L.lvl), h("span", null, "nivel")),
            h("div", null, h("b", null, prof.days || 0), h("span", null, "días seguidos"))),
          h("ul", { class: "g-rules" },
            h("li", null, "12 retos · 3 vidas"),
            h("li", null, "Rápido = más puntos"),

            h("button", { class: "btn primary g-play", onclick: play }, "Jugar"),
            h("button", { class: "btn ghost", onclick: function () { prof.sound = !prof.sound; saveStore(); intro(); } }, prof.sound ? "Sonido: sí" : "Sonido: no"))));
    }

    function play() {
      var deck = makeChallenges(texts);
      var S = { i: 0, lives: G_LIVES, score: 0, combo: 0, maxCombo: 0, right: 0, done: 0, wrongs: [] };
      var hud = h("div", { class: "g-hud" });
      var stage = h("div", { class: "g-stage" });
      clear(root); add(root, hud, stage);
      beep([440], 0.05);

      function mult() { return S.combo >= 10 ? 4 : S.combo >= 6 ? 3 : S.combo >= 3 ? 2 : 1; }
      function paintHud(pop) {
        clear(hud);
        var hearts = h("span", { class: "g-lives", "aria-label": S.lives + " vidas" });
        for (var i = 0; i < G_LIVES; i++) add(hearts, h("i", { class: i < S.lives ? "on" : "off" }));
        add(hud,
          hearts,
          h("span", { class: "g-prog" }, Math.min(S.i + 1, G_TOTAL) + "/" + G_TOTAL),
          h("span", { class: "g-combo m" + mult() + (pop ? " pop" : "") }, "x" + mult(), h("small", null, S.combo ? " · racha " + S.combo : "")),
          h("span", { class: "g-score" + (pop ? " pop" : "") }, S.score));
      }
      function floatPts(anchor, txt, cls) {
        var f = h("div", { class: "g-float " + (cls || "") }, txt);
        anchor.appendChild(f);
        setTimeout(function () { f.remove(); }, 900);
      }
      function banner(txt, cls) {
        var b = h("div", { class: "g-banner " + (cls || "") }, txt);
        root.appendChild(b);
        setTimeout(function () { b.remove(); }, 1300);
      }

      function resolve(ok, c, card, frac, explain) {
        stopTimer();
        S.done++;
        if (ok) {
          S.right++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
          var pts = Math.round((100 + 100 * Math.max(0, frac)) * mult() * (c.gold ? 2 : 1));
          S.score += pts;
          paintHud(true);
          floatPts(card, "+" + pts, c.gold ? "gold" : "");
          sfxRight(S.combo); buzz(15);
          card.classList.add("g-ok");
          if (S.combo === 3 || S.combo === 6 || S.combo === 10) { banner("Racha " + S.combo + " · x" + mult(), "combo"); sfxBig(); confetti(S.combo * 12); }
          setTimeout(next, 850);
        } else {
          S.combo = 0; S.lives--; S.wrongs.push(c);
          paintHud(false);
          sfxWrong(); buzz([40, 40, 40]);
          card.classList.add("g-ko");
          add(card, h("div", { class: "feedback ko", html: "<strong>" + (frac < 0 ? "Tiempo." : "Fallo.") + "</strong> " + (explain || "") }),
            h("button", { class: "btn primary", onclick: next }, S.lives > 0 ? "Seguir" : "Ver resultado"));
          var btn = card.querySelector(".btn.primary:last-child"); if (btn) btn.focus();
        }
      }

      function timerBar(c, card, onTimeout) {
        var bar = h("div", { class: "g-timer" }, h("i"));
        var total = c.time * 1000, t0 = Date.now();
        ivTimer = setInterval(function () {
          var left = 1 - (Date.now() - t0) / total;
          bar.firstChild.style.width = Math.max(0, left * 100) + "%";
          bar.classList.toggle("low", left < 0.3);
          if (left <= 0) { stopTimer(); onTimeout(); }
        }, 80);
        timers.push(ivTimer);
        return { el: bar, frac: function () { return 1 - (Date.now() - t0) / total; } };
      }

      function head(c) {
        var lbl = c.kind === "vf" ? (c.label || "Verdadero o falso") : c.kind === "match" ? "Empareja" : c.kind === "order" ? "Ordena en el tiempo" : (c.label || "Pregunta");
        return h("div", { class: "row", style: "justify-content:space-between" },
          h("span", { class: "eyebrow" }, lbl, c.gold ? h("span", { class: "g-gold" }, " · dorada x2") : null),
          texts.length > 1 && c.src ? h("span", { class: "src-tag" }, c.src) : null);
      }

      function renderChoice(c) {
        var card = h("div", { class: "card stack g-card" + (c.gold ? " gold" : "") });
        var idx = c.o.map(function (_, i) { return i; });
        var order = c.fixed ? idx : shuffle(idx);
        var locked = false;
        var tb = timerBar(c, card, function () { if (!locked) { locked = true; mark(-1); resolve(false, c, card, -1, rightTxt()); } });
        function rightTxt() { return "Era: <em>" + md(short(c.o[c.r], 220)) + "</em>" + (c.x ? "<br>" + md(c.x) : ""); }
        var btns = order.map(function (oi) {
          return h("button", { class: "opt", html: md(c.o[oi]), onclick: function (e) {
            if (locked) return; locked = true;
            var ok = oi === c.r;
            mark(ok ? -2 : oi, e.currentTarget);
            resolve(ok, c, card, tb.frac(), ok ? "" : rightTxt());
          } });
        });
        function mark(chosen, el) {
          btns.forEach(function (b, k) { b.disabled = true; if (order[k] === c.r) b.classList.add("right"); });
          if (chosen >= 0 && el) el.classList.add("wrong");
        }
        add(card, head(c), tb.el, h("div", { class: "qtext", html: md(c.q) }), h("div", { class: "opts" + (c.kind === "vf" ? " vf" : "") }, btns));
        return card;
      }

      function renderMatch(c) {
        var card = h("div", { class: "card stack g-card" + (c.gold ? " gold" : "") });
        var terms = shuffle(c.pairs), defs = shuffle(c.pairs);
        var sel = null, found = 0, misses = 0, done = false;
        var tb = timerBar(c, card, function () { if (!done) { done = true; resolve(false, c, card, -1, solution()); } });
        function solution() { return c.pairs.map(function (p) { return "<br><strong>" + esc(p.t) + "</strong>: " + md(short(p.d, 110)); }).join(""); }
        var tBtns = terms.map(function (p) {
          var b = h("button", { class: "g-chip", onclick: function () {
            if (done || b.disabled) return;
            tBtns.forEach(function (x) { x.classList.remove("sel"); });
            sel = p; b.classList.add("sel");
          } }, p.t);
          b._p = p; return b;
        });
        var dBtns = defs.map(function (p) {
          var b = h("button", { class: "opt small-opt", html: md(short(p.d, 120)), onclick: function () {
            if (done || !sel || b.disabled) return;
            if (sel === p) {
              found++; b.disabled = true; b.classList.add("right");
              tBtns.forEach(function (x) { if (x._p === p) { x.disabled = true; x.classList.remove("sel"); x.classList.add("done"); } });
              sel = null; beep([660 + found * 60], 0.05, "triangle");
              if (found === c.pairs.length) { done = true; resolve(misses <= 1, c, card, tb.frac(), solution()); }
            } else {
              misses++; b.classList.add("shake"); setTimeout(function () { b.classList.remove("shake"); }, 400);
              beep([200], 0.08, "sawtooth");
              if (misses > 2) { done = true; resolve(false, c, card, 0, "Demasiados fallos. Solución:" + solution()); }
            }
          } });
          return b;
        });
        add(card, head(c), tb.el, h("div", { class: "qtext" }, "Toca un término y luego su definición"),
          h("div", { class: "g-chips" }, tBtns), h("div", { class: "opts" }, dBtns),
          h("p", { class: "muted small" }, "Máximo 1 fallo para que cuente como acierto."));
        return card;
      }

      function renderOrder(c) {
        var card = h("div", { class: "card stack g-card" + (c.gold ? " gold" : "") });
        var correct = c.items.slice().sort(function (a, b) { return String(a.a).localeCompare(String(b.a)); });
        var picked = [], done = false;
        var tb = timerBar(c, card, function () { if (!done) { done = true; resolve(false, c, card, -1, sol()); } });
        function sol() { return correct.map(function (x) { return "<br><strong>" + esc(x.a) + "</strong> " + md(short(x.t, 90)); }).join(""); }
        var list = h("div", { class: "opts" });
        var btns = shuffle(c.items).map(function (it) {
          var b = h("button", { class: "opt", html: md(short(it.t, 120)), onclick: function () {
            if (done || b.disabled) return;
            picked.push(it); b.disabled = true;
            var pos = picked.length;
            b.insertBefore(h("span", { class: "g-num" }, pos), b.firstChild);
            if (correct[pos - 1] !== it && correct[pos - 1].a !== it.a) {
              done = true; b.classList.add("wrong"); resolve(false, c, card, 0, "Orden correcto:" + sol());
            } else {
              b.classList.add("right"); beep([600 + pos * 80], 0.05, "triangle");
              if (pos === correct.length) { done = true; resolve(true, c, card, tb.frac()); }
            }
          } });
          return b;
        });
        add(list, btns);
        add(card, head(c), tb.el, h("div", { class: "qtext" }, "Toca los hechos del más antiguo al más reciente"), list);
        return card;
      }

      function next() {
        stopTimer();
        if (S.lives <= 0 || S.i >= G_TOTAL || S.i >= deck.length) return end();
        var c = deck[S.i];
        S.i++;
        paintHud(false);
        clear(stage);
        var card = c.kind === "match" ? renderMatch(c) : c.kind === "order" ? renderOrder(c) : renderChoice(c);
        add(stage, card);
        if (c.gold) { banner("Pregunta dorada", "gold"); beep([880, 1175], 0.06, "triangle"); }
      }

      function end() {
        stopTimer();
        var acc = S.done ? Math.round((S.right / S.done) * 100) : 0;
        var survived = S.lives > 0;
        if (survived) S.score += S.lives * 150;
        var gs = st(key).game || { best: 0, plays: 0, medal: "" };
        var record = S.score > (gs.best || 0);
        var medal = survived ? gMedal(acc) : "";
        var rankOrder = ["", "bronce", "plata", "oro"];
        gs.best = Math.max(gs.best || 0, S.score);
        gs.plays = (gs.plays || 0) + 1;
        if (rankOrder.indexOf(medal) > rankOrder.indexOf(gs.medal || "")) gs.medal = medal;
        st(key).game = gs;
        // XP, nivel y racha de días
        var before = gLevel(prof.xp);
        var gained = Math.round(S.score / 10);
        prof.xp += gained;
        var after = gLevel(prof.xp);
        var td = today();
        if (prof.last !== td) { prof.days = prof.last === today(-1) ? (prof.days || 0) + 1 : 1; prof.last = td; }
        saveStore();

        clear(root);
        var bar = h("div", { class: "meter g-xp" }, h("i", { style: "width:" + Math.round((before.lvl === after.lvl ? before.into : 0) / after.need * 100) + "%" }));
        add(root, h("div", { class: "card stack g-end" },
          h("span", { class: "eyebrow" }, survived ? "Partida completada" : "Sin vidas"),
          h("div", { class: "g-final" }, h("span", { class: "score", "data-to": S.score }, "0"), record ? h("span", { class: "g-record" }, "Nuevo récord") : null),
          h("p", null, gRank(acc) + " · " + acc + "% de aciertos · racha máxima " + S.maxCombo + (survived ? " · +" + S.lives * 150 + " por vidas" : "")),
          medal ? h("div", { class: "g-medal " + medal }, "Medalla de " + medal) : null,
          h("div", { class: "stack", style: "gap:6px" },
            h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "eyebrow" }, "Nivel " + after.lvl), h("span", { class: "src-tag" }, "+" + gained + " XP")),
            bar),
          S.wrongs.length ? h("details", { class: "sec" }, h("summary", null, "Repasa tus fallos (" + S.wrongs.length + ")"),
            h("ul", null, S.wrongs.map(function (w) {
              if (w.kind === "match") return h("li", null, "Emparejar: " + w.pairs.map(function (p) { return p.t; }).join(", "));
              if (w.kind === "order") return h("li", null, "Cronología: " + w.items.slice().sort(function (a, b) { return String(a.a).localeCompare(String(b.a)); }).map(function (x) { return x.a; }).join(" → "));
              return h("li", { html: md(short(w.q, 140)) + " → <strong>" + md(short(w.o[w.r], 140)) + "</strong>" });
            }))) : null,
          h("div", { class: "row" },
            h("button", { class: "btn primary g-play", onclick: play }, "Otra partida"),
            h("button", { class: "btn ghost", onclick: intro }, "Salir"))));
        // contador animado
        var sc = root.querySelector("[data-to]"), to = S.score, t0 = performance.now();
        (function tick(now) {
          var k = Math.min(1, (now - t0) / (reduced ? 1 : 900));
          sc.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
          if (k < 1) requestAnimationFrame(tick);
        })(t0);
        setTimeout(function () {
          bar.firstChild.style.width = Math.round(after.into / after.need * 100) + "%";
          if (after.lvl > before.lvl) { banner("Subes a nivel " + after.lvl, "combo"); sfxBig(); confetti(160); }
          else if (record || medal === "oro") { sfxBig(); confetti(110); }
        }, 500);
      }

      next();
    }

    intro();
    return root;
  }
  function tabJuego(t, el) { add(el, gameView([t], t.id, t.autor + " · " + t.titulo)); }
  function viewGame(semId) {
    var s = SEMS.filter(function (x) { return x.id === semId; })[0];
    var ids = s ? s.textos : SEMS.reduce(function (a, x) { return a.concat(x.textos); }, []);
    var texts = ids.filter(function (id) { return TXT[id]; }).map(function (id) { return TXT[id]; });
    setCrumb(s ? [[s.nombre, "s-" + s.id], ["Juego"]] : [["Juego"]]);
    add(app, h("header", { class: "thead" },
      h("span", { class: "eyebrow" }, "Partida mixta"),
      h("h1", null, s ? "Juego: " + s.nombre : "Juego: todos los textos"),
      h("p", { class: "es" }, "Retos de " + texts.map(function (t) { return t.autor; }).join(", ") + " mezclados. Incluye «¿Quién lo dijo?».")));
    add(app, gameView(texts, s ? "game-" + s.id : "game-all", "Partida mixta"));
  }

  /* ---------- vista: seminario ---------- */
  function viewSeminar(id) {
    var s = SEMS.filter(function (x) { return x.id === id; })[0];
    if (!s) return viewHome();
    setCrumb([[s.nombre]]);
    add(app, h("header", { class: "thead" },
      h("span", { class: "eyebrow" }, s.tema),
      h("h1", null, s.nombre),
      s.orden ? h("p", { class: "es" }, s.orden) : null));
    var el = h("div", { class: "stack-l" });
    add(app, el);
    add(el, h("div", { class: "stack" }, s.textos.filter(function (x) { return TXT[x]; }).map(textItem)));
    if (s.textos.length > 1) add(el, h("div", { class: "row" }, h("a", { class: "btn primary", href: "#j-" + s.id }, "Jugar con los " + s.textos.length + " textos mezclados")));
    if (s.comparacion) {
      add(el, section("Comparación", "Las dos lecturas, punto por punto."));
      add(el, h("div", { class: "tablebox" }, h("table", null,
        h("thead", null, h("tr", null, h("th", null, ""), s.comparacion.columnas.map(function (c) { return h("th", null, c); }))),
        h("tbody", null, s.comparacion.filas.map(function (f) {
          return h("tr", null, f.map(function (c) { return h("td", { html: md(c) }); }));
        }))
      )));
    }
    if (s.conexiones) {
      add(el, section("Conexiones", "Dónde coinciden y dónde chocan."));
      add(el, h("div", null, s.conexiones.map(function (c) {
        return h("div", { class: "concept" }, h("div", { class: "term", html: md(c.t) }), h("div", { html: md(c.d) }));
      })));
    }
    var tq = [];
    s.textos.forEach(function (x) { if (TXT[x]) TXT[x].test.forEach(function (q) { tq.push(normalizeQ(q, TXT[x].autor)); }); });
    if (s.textos.length > 1 && tq.length) {
      add(el, section("Test mixto", "Preguntas de ambos textos mezcladas. Mezclar temas obliga a distinguir a quién pertenece cada idea."));
      add(el, quiz(shuffle(tq).slice(0, 12), null, { showSrc: true }));
    }
    if (s.sintesis) {
      add(el, section("Preguntas de síntesis", "Para preparar la discusión del seminario."));
      s.sintesis.forEach(function (ex, i) { add(el, exercise(ex, "sem-" + s.id + "-" + i, "sem-" + s.id)); });
    }
  }

  /* ---------- vista: método ---------- */
  function viewMethod() {
    setCrumb([["Método"]]);
    add(app, h("header", { class: "thead" },
      h("span", { class: "eyebrow" }, "Cómo funciona"),
      h("h1", null, "El método de los 20 minutos"),
      h("p", { class: "es" }, "La app no te hace releer: te hace recuperar, estructurar y explicar, que es lo que la investigación sobre aprendizaje muestra que funciona.")));
    var el = h("div", { class: "stack-l" });
    add(app, el);
    add(el, h("div", { class: "method" }, STEPS.map(function (sp, i) {
      var acc = STEPS.slice(0, i).reduce(function (a, b) { return a + b.min; }, 0);
      return h("div", { class: "m" },
        h("div", { class: "t" }, acc + "–" + (acc + sp.min) + "′"),
        h("div", { class: "stack", style: "gap:4px" }, h("h3", null, sp.n), h("p", { class: "muted" }, sp.why)));
    })));
    add(el, section("En qué se basa"));
    var ev = [
      ["Práctica de recuperación (test)", "alta", "Hacerse preguntas mejora la retención a largo plazo mucho más que releer (Roediger y Karpicke, 2006). Dunlosky et al. (2013) la sitúan entre las dos técnicas de mayor utilidad."],
      ["Repaso espaciado", "alta", "Repartir los repasos en días separados vence a la curva del olvido (Ebbinghaus; Cepeda et al., 2006). Por eso las tarjetas vuelven a los 1, 3, 7, 14 y 30 días."],
      ["Pre-test", "media", "Intentar responder antes de estudiar, incluso fallando, mejora lo que se aprende después (Richland, Kornell y Kao, 2009)."],
      ["Organizador previo", "media", "Dar primero la idea general facilita integrar los detalles (Ausubel, 1960). De ahí la tesis en una frase."],
      ["Mapas y doble codificación", "media", "Combinar lo visual y lo verbal mejora el recuerdo (Paivio); los mapas conceptuales superan a la lectura de listas o textos (Nesbit y Adesope, 2006)."],
      ["Autoexplicación y Feynman", "media", "Explicar con tus palabras revela lo que no entiendes (Chi et al., 1994)."],
      ["Interrogación elaborativa", "media", "Preguntarse «¿por qué?» y «¿qué prueba esto?» ante cada caso conecta la idea con lo que ya sabes."],
      ["Práctica intercalada", "media", "Mezclar preguntas de varios textos obliga a discriminar entre ideas (Rohrer y Taylor, 2007). Es el test mixto del seminario."],
      ["Releer y subrayar", "baja", "Dan sensación de dominio pero rinden poco (Dunlosky et al., 2013). Aquí el subrayado solo marca lo que debes poder recuperar."]
    ];
    add(el, h("ul", { class: "evid" }, ev.map(function (e) {
      return h("li", null, h("strong", null, e[0]), h("span", { class: "lvl " + e[1] }, "utilidad " + e[1]), h("br"), h("span", { class: "muted" }, e[2]));
    })));
    add(el, section("Plan de repaso"));
    add(el, h("div", { class: "tablebox" }, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Cuándo"), h("th", null, "Qué"), h("th", null, "Tiempo"))),
      h("tbody", null, [
        ["Día 0", "Ruta 20′", "20 min"],
        ["Día 1", "Tarjetas pendientes", "5 min"],
        ["Día 3", "Tarjetas + test completo", "8 min"],
        ["Día 7", "Ejercicios de ensayo + comparación del seminario", "15 min"],
        ["Antes del seminario", "Test mixto + citas clave", "10 min"]
      ].map(function (r) { return h("tr", null, r.map(function (c) { return h("td", null, c); })); }))
    )));
    add(el, h("p", { class: "muted small" }, "Tu progreso (tarjetas, test, respuestas) se guarda solo en este navegador."));
  }

  window.addEventListener("hashchange", render);
  render();
})();
